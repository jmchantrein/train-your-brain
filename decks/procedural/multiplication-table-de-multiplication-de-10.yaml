resources:
  - type: summary
    title: "Qu'est-ce que la multiplication ?"
    content: "La **multiplication** est une opération arithmétique qui permet de calculer rapidement une somme de nombres identiques.\n\nPar exemple : **3 × 4 = 12** signifie 3 + 3 + 3 + 3 = 12\n\nLes tables de multiplication sont essentielles pour :\n- Le calcul mental rapide\n- La résolution de problèmes mathématiques\n- Les divisions, fractions et pourcentages"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Table de multiplication"
    url: https://fr.wikipedia.org/wiki/Table_de_multiplication
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Multiplication** : Opération qui donne le produit de deux nombres\n- **Facteur** : Nombre que l'on multiplie (ex: dans 3 × 4, les facteurs sont 3 et 4)\n- **Produit** : Résultat d'une multiplication\n- **Commutativité** : Propriété : l'ordre des facteurs ne change pas le produit (3 × 4 = 4 × 3)"
    icon: 📚

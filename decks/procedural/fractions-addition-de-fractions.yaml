resources:
  - type: summary
    title: "Qu'est-ce qu'une fraction ?"
    content: "Une **fraction** représente une partie d'un tout. Elle s'écrit sous la forme a/b où :\n- **a** est le numérateur (nombre de parts prises)\n- **b** est le dénominateur (nombre total de parts)\n\nPar exemple : **3/4** signifie 3 parts sur 4 au total.\n\nLes fractions sont utilisées pour :\n- Exprimer des proportions\n- Représenter des divisions\n- Calculer des pourcentages"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Fraction"
    url: https://fr.wikipedia.org/wiki/Fraction_(mathématiques)
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Fraction** : Nombre qui représente une partie d'un tout (a/b)\n- **Numérateur** : Nombre au-dessus de la barre de fraction\n- **Dénominateur** : Nombre en-dessous de la barre de fraction\n- **Fraction irréductible** : Fraction simplifiée au maximum\n- **Fractions équivalentes** : Fractions représentant le même nombre (1/2 = 2/4)\n- **PGCD** : Plus Grand Commun Diviseur (pour simplifier)"
    icon: 📚
  - type: summary
    title: Addition de fractions
    content: "Pour additionner des fractions de **même dénominateur**, on additionne les numérateurs et on garde le même dénominateur.\n\nExemple : 2/5 + 1/5 = 3/5\n\n⚠️ On n'additionne JAMAIS les dénominateurs !"
    aiGenerated: true
    icon: 📝
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Additionner des fractions de même dénominateur\n- ✅ Simplifier le résultat si possible\n- ✅ Ne pas confondre avec l'addition des dénominateurs"
    icon: 🎯
  - type: tip
    title: Méthode
    content: "Pour a/d + b/d :\n1. Vérifier que les dénominateurs sont égaux\n2. Additionner les numérateurs : (a + b)\n3. Garder le même dénominateur : d\n4. Simplifier si possible"
    icon: 💡

  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Mémoriser la table de division par 6\n- ✅ Répondre en moins de 3 secondes\n- ✅ Faire le lien avec la table de multiplication correspondante"
    icon: 🎯
  - type: tip
    title: Lien avec la multiplication
    content: "Division et multiplication sont inverses !\n\nSi 6 × 4 = 24, alors 24 ÷ 6 = 4\n\nConnaître les tables de multiplication aide beaucoup pour les divisions."
    icon: 💡

resources:
  - type: summary
    title: "Qu'est-ce que l'addition ?"
    content: "L'**addition** est l'opération mathématique la plus fondamentale. Elle permet de combiner deux nombres pour obtenir leur somme.\n\nPar exemple : **5 + 3 = 8** signifie que si on a 5 objets et qu'on en ajoute 3, on en a 8 au total.\n\nLes tables d'addition sont la base pour :\n- Le calcul mental rapide\n- La compréhension de la soustraction (opération inverse)\n- L'apprentissage des tables de multiplication"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Addition"
    url: https://fr.wikipedia.org/wiki/Addition
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Addition** : Opération qui réunit deux nombres en un seul (leur somme)\n- **Termes** : Les nombres que l'on additionne\n- **Somme** : Résultat d'une addition\n- **Commutativité** : L'ordre des termes ne change pas la somme (3 + 5 = 5 + 3)"
    icon: 📚
  - type: image
    title: "Table d'addition"
    image: "data:image/svg+xml;base64,"
    aiGenerated: false
    icon: 📊
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Maîtriser toutes les additions de 1 à 10\n- ✅ Répondre en moins de 2 secondes\n- ✅ Reconnaître les doubles (2+2, 3+3, ...)"
    icon: 🎯
  - type: tip
    title: Commutativité
    content: "L'addition est commutative : 3 + 7 = 7 + 3 = 10\n\nEn connaissant cette propriété, il suffit d'apprendre la moitié des combinaisons !"
    icon: 💡

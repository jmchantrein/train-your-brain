  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Mémoriser la table de division par 10\n- ✅ Répondre en moins de 3 secondes\n- ✅ Faire le lien avec la table de multiplication correspondante"
    icon: 🎯
  - type: tip
    title: Astuce pour diviser par 10
    content: Diviser par 10 revient à enlever un 0 (ou déplacer la virgule).
    icon: 💡
  - type: tip
    title: Lien avec la multiplication
    content: "Division et multiplication sont inverses !\n\nSi 10 × 4 = 40, alors 40 ÷ 10 = 4\n\nConnaître les tables de multiplication aide beaucoup pour les divisions."
    icon: 💡

  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Maîtriser la soustraction de 1\n- ✅ Répondre rapidement sans calculer sur ses doigts\n- ✅ Faire le lien avec les tables d'addition"
    icon: 🎯
  - type: tip
    title: "Lien avec l'addition"
    content: "La soustraction est l'inverse de l'addition !\n\nSi 5 + 1 = 6, alors 6 - 1 = 5\n\nConnaître ses tables d'addition aide à réussir les soustractions."
    icon: 💡

resources:
  - type: summary
    title: Les compléments à 10
    content: "Les **compléments à 10** sont les paires de nombres dont la somme fait 10.\n\nConnaître ces compléments par cœur est essentiel pour :\n- Le calcul mental rapide\n- Les additions à plusieurs chiffres (passage de dizaine)\n- Les soustractions\n\nLes paires à retenir : 0+10, 1+9, 2+8, 3+7, 4+6, 5+5"
    aiGenerated: true
    icon: 📝
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Connaître par cœur tous les compléments à 10\n- ✅ Répondre instantanément sans calculer\n- ✅ Utiliser ces connaissances pour le calcul mental"
    icon: 🎯
  - type: tip
    title: Astuce mnémotechnique
    content: "Visualisez vos deux mains : chaque complément correspond à lever certains doigts sur une main et les autres sur l'autre main.\n\nPar exemple : 3 + 7 = 10 → 3 doigts sur une main, 7 sur l'autre"
    icon: 💡

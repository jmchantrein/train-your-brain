    icon: 📊
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Mémoriser la table de division par 3\n- ✅ Répondre en moins de 3 secondes\n- ✅ Faire le lien avec la table de multiplication correspondante"
    icon: 🎯
  - type: tip
    title: Lien avec la multiplication
    content: "Division et multiplication sont inverses !\n\nSi 3 × 4 = 12, alors 12 ÷ 3 = 4\n\nConnaître les tables de multiplication aide beaucoup pour les divisions."
    icon: 💡

resources:
  - type: summary
    title: Les compléments à 1000
    content: "Les **compléments à 1000** (par centaines) sont les paires de nombres dont la somme fait 1000.\n\nCe deck se concentre sur les centaines : 100+900, 200+800, 300+700, etc.\n\nCette compétence est utile pour :\n- Manipuler les grands nombres facilement\n- Les additions et soustractions à 4 chiffres\n- Le calcul mental avec des montants en euros"
    aiGenerated: true
    icon: 📝
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Connaître par cœur les compléments à 1000 (centaines)\n- ✅ Faire le lien avec les compléments à 10 et 100\n- ✅ Appliquer au calcul mental quotidien"
    icon: 🎯
  - type: tip
    title: Lien avec les compléments à 10
    content: "Les compléments à 1000 suivent la même logique que les compléments à 10 !\n\n300 + 700 = 1000 → car 3 + 7 = 10\n400 + 600 = 1000 → car 4 + 6 = 10\n\nIl suffit d'ajouter deux 0 à droite."
    icon: 💡

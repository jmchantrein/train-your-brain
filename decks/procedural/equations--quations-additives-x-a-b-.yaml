resources:
  - type: summary
    title: "Qu'est-ce qu'une équation ?"
    content: "Une **équation** est une égalité contenant une inconnue (souvent notée x) qu'il faut trouver.\n\nPar exemple : **x + 5 = 12** → On cherche quel nombre additionné à 5 donne 12.\n\nLa réponse est x = 7 car 7 + 5 = 12.\n\nLes équations sont la base de l'algèbre et permettent de :\n- Résoudre des problèmes mathématiques\n- Modéliser des situations réelles\n- Comprendre les relations entre les nombres"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Équation"
    url: https://fr.wikipedia.org/wiki/Équation
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Équation** : Égalité contenant une inconnue\n- **Inconnue** : La valeur que l'on cherche (x)\n- **Solution** : La valeur qui rend l'équation vraie\n- **Membre** : Chaque côté de l'égalité (gauche/droit)"
    icon: 📚
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Résoudre des équations de type x + a = b\n- ✅ Comprendre l'opération inverse (soustraction)\n- ✅ Répondre en moins de 5 secondes"
    icon: 🎯
  - type: tip
    title: Méthode de résolution
    content: "Pour résoudre x + a = b :\n\n1. Isoler x en soustrayant a des deux côtés\n2. x = b - a\n\nExemple : x + 5 = 12 → x = 12 - 5 = 7"
    icon: 💡

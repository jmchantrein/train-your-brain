  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Mémoriser la table de division par 9\n- ✅ Répondre en moins de 3 secondes\n- ✅ Faire le lien avec la table de multiplication correspondante"
    icon: 🎯
  - type: tip
    title: Astuce pour diviser par 9
    content: Un nombre est divisible par 9 si la somme de ses chiffres est divisible par 9.
    icon: 💡
  - type: tip
    title: Lien avec la multiplication
    content: "Division et multiplication sont inverses !\n\nSi 9 × 4 = 36, alors 36 ÷ 9 = 4\n\nConnaître les tables de multiplication aide beaucoup pour les divisions."
    icon: 💡

  - type: glossary
    title: Vocabulaire clé
    content: "- **Multiplication** : Opération qui donne le produit de deux nombres\n- **Facteur** : Nombre que l'on multiplie (ex: dans 3 × 4, les facteurs sont 3 et 4)\n- **Produit** : Résultat d'une multiplication\n- **Commutativité** : Propriété : l'ordre des facteurs ne change pas le produit (3 × 4 = 4 × 3)"

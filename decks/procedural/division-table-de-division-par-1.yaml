resources:
  - type: summary
    title: "Qu'est-ce que la division ?"
    content: "La **division** est l'opération inverse de la multiplication. Elle permet de partager une quantité en parts égales ou de savoir combien de fois un nombre est contenu dans un autre.\n\nPar exemple : **12 ÷ 4 = 3** signifie que 12 partagé en 4 parts égales donne 3 par part.\n\nLes tables de division sont essentielles pour :\n- Le calcul mental rapide\n- Les fractions et pourcentages\n- La résolution de problèmes"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Division"
    url: https://fr.wikipedia.org/wiki/Division
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Division** : Opération qui partage un nombre en parts égales\n- **Dividende** : Le nombre que l'on divise\n- **Diviseur** : Le nombre par lequel on divise\n- **Quotient** : Résultat d'une division\n- **Reste** : Ce qui reste quand la division n'est pas exacte"
    icon: 📚
  - type: image
    title: Diviser par 1
    image: "data:image/svg+xml;base64,"
    aiGenerated: false
    icon: 📊
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Mémoriser la table de division par 1\n- ✅ Répondre en moins de 3 secondes\n- ✅ Faire le lien avec la table de multiplication correspondante"
    icon: 🎯
  - type: tip
    title: Astuce pour diviser par 1
    content: Tout nombre divisé par 1 reste inchangé.
    icon: 💡
  - type: tip
    title: Lien avec la multiplication
    content: "Division et multiplication sont inverses !\n\nSi 1 × 4 = 4, alors 4 ÷ 1 = 4\n\nConnaître les tables de multiplication aide beaucoup pour les divisions."
    icon: 💡

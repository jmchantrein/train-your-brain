    icon: 📊
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Mémoriser la table de division par 5\n- ✅ Répondre en moins de 3 secondes\n- ✅ Faire le lien avec la table de multiplication correspondante"
    icon: 🎯
  - type: tip
    title: Astuce pour diviser par 5
    content: "Diviser par 5 : un nombre est divisible par 5 s'il se termine par 0 ou 5."
    icon: 💡
  - type: tip
    title: Lien avec la multiplication
    content: "Division et multiplication sont inverses !\n\nSi 5 × 4 = 20, alors 20 ÷ 5 = 4\n\nConnaître les tables de multiplication aide beaucoup pour les divisions."
    icon: 💡

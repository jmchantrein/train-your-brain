resources:
  - type: summary
    title: "Qu'est-ce qu'un pourcentage ?"
    content: "Un **pourcentage** exprime une proportion sur 100.\n\n**25%** signifie \"25 pour 100\" ou \"25 centièmes\" ou encore ¼.\n\nLes pourcentages sont partout :\n- Soldes et réductions (-20%)\n- TVA et taxes (+20%)\n- Statistiques et sondages\n- Notes et résultats\n\nFormule : X% de N = (X × N) / 100"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Pourcentage"
    url: https://fr.wikipedia.org/wiki/Pourcentage
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Pourcentage** : Proportion exprimée sur 100\n- **Pour cent** : Division par 100 (le symbole %)\n- **Taux** : Pourcentage utilisé pour calculs\n- **Remise** : Réduction en pourcentage\n- **Augmentation** : Ajout d'un pourcentage"
    icon: 📚
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Calculer 10%, 25%, 50% instantanément\n- ✅ Appliquer les techniques de division\n- ✅ Combiner les pourcentages"
    icon: 🎯
  - type: tip
    title: Calcul mental des pourcentages
    content: "La clé : ramener à 10% ou 50%\n\n• 10% = ÷10 (enlever un 0 ou décaler la virgule)\n• 5% = la moitié de 10%\n• 20% = 2 × 10%\n• 25% = ÷4 = 50% ÷ 2\n• 15% = 10% + 5%\n• 30% = 3 × 10%"
    icon: 💡

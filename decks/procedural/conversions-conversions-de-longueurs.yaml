resources:
  - type: summary
    title: "Les conversions d'unités"
    content: "Les **conversions** permettent d'exprimer une même mesure avec différentes unités.\n\nLe système métrique est basé sur des puissances de 10 :\n- kilo (k) = 1000\n- hecto (h) = 100\n- déca (da) = 10\n- unité = 1\n- déci (d) = 0,1\n- centi (c) = 0,01\n- milli (m) = 0,001\n\nConvertir c'est multiplier ou diviser par 10, 100, 1000..."
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Système métrique"
    url: https://fr.wikipedia.org/wiki/Système_métrique
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Conversion** : Changement d'unité pour une même mesure\n- **Préfixe** : Symbole indiquant le multiple (k, c, m...)\n- **Unité SI** : Unité du Système International\n- **Multiple** : Unité plus grande (km, kg)\n- **Sous-multiple** : Unité plus petite (mm, mg)"
    icon: 📚
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Convertir km ↔ m ↔ cm ↔ mm\n- ✅ Multiplier/diviser par 10, 100, 1000\n- ✅ Mémoriser les équivalences"
    icon: 🎯
  - type: tip
    title: Conversions de longueurs
    content: "Rappels :\n• 1 km = 1000 m\n• 1 m = 100 cm = 1000 mm\n• 1 cm = 10 mm\n\nPour convertir :\n• Vers plus petit → multiplier\n• Vers plus grand → diviser"
    icon: 💡

resources:
  - type: summary
    title: Les compléments à 100
    content: "Les **compléments à 100** (par dizaines) sont les paires de nombres dont la somme fait 100.\n\nCe deck se concentre sur les dizaines : 10+90, 20+80, 30+70, etc.\n\nCette compétence est utile pour :\n- Calculer rapidement la monnaie à rendre\n- Les additions et soustractions à 3 chiffres\n- Les pourcentages (ex: 30% et 70% font 100%)"
    aiGenerated: true
    icon: 📝
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Connaître par cœur les compléments à 100 (dizaines)\n- ✅ Faire le lien avec les compléments à 10 (même logique)\n- ✅ Appliquer au calcul mental quotidien"
    icon: 🎯
  - type: tip
    title: Lien avec les compléments à 10
    content: "Les compléments à 100 suivent la même logique que les compléments à 10 !\n\n30 + 70 = 100 → car 3 + 7 = 10\n40 + 60 = 100 → car 4 + 6 = 10\n\nIl suffit d'ajouter un 0 à droite."
    icon: 💡

resources:
  - type: summary
    title: "Qu'est-ce que la soustraction ?"
    content: "La **soustraction** est l'opération inverse de l'addition. Elle permet de calculer une différence entre deux nombres.\n\nPar exemple : **8 - 3 = 5** signifie que si on a 8 objets et qu'on en retire 3, il en reste 5.\n\nLes tables de soustraction sont essentielles pour :\n- Le calcul mental rapide\n- La résolution de problèmes du quotidien\n- La préparation aux équations"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Soustraction"
    url: https://fr.wikipedia.org/wiki/Soustraction
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Soustraction** : Opération qui calcule la différence entre deux nombres\n- **Diminuende** : Le nombre duquel on soustrait (premier terme)\n- **Diminuteur** : Le nombre que l'on soustrait (second terme)\n- **Différence** : Résultat d'une soustraction\n- **Retenue** : Report lors d'une soustraction posée"
    icon: 📚
  - type: image
    title: Table de soustraction
    image: "data:image/svg+xml;base64,"
    aiGenerated: false
    icon: 📊
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Maîtriser toutes les soustractions de 1 à 10\n- ✅ Répondre en moins de 2 secondes\n- ✅ Faire le lien avec les additions (opération inverse)"
    icon: 🎯
  - type: tip
    title: "Relation avec l'addition"
    content: "La soustraction est l'inverse de l'addition :\n\nSi 7 + 3 = 10, alors 10 - 3 = 7 et 10 - 7 = 3\n\nConnaître les tables d'addition aide beaucoup !"
    icon: 💡

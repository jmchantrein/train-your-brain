  - type: summary
    title: "Qu'est-ce que le tableau périodique ?"
    content: "Le **tableau périodique des éléments** est un arrangement systématique des éléments chimiques, classés par **numéro atomique croissant** (nombre de protons).\n\nLes éléments sont organisés en :\n- **Lignes (périodes)** : éléments avec le même nombre de couches électroniques\n- **Colonnes (groupes)** : éléments aux propriétés chimiques similaires\n\nCréé par **Dmitri Mendeleïev** en 1869, il a permis de prédire l'existence d'éléments inconnus à l'époque."
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Tableau périodique des éléments"
    url: https://fr.wikipedia.org/wiki/Tableau_périodique_des_éléments
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Numéro atomique (Z)** : Nombre de protons dans le noyau d'un atome\n- **Symbole chimique** : Abréviation d'une ou deux lettres (ex: H, He, Na)\n- **Période** : Ligne horizontale du tableau (même nombre de couches)\n- **Groupe** : Colonne verticale du tableau (propriétés similaires)\n- **Électronégativité** : Capacité d'un atome à attirer les électrons"
    icon: 📚
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Connaître les éléments 21-36 (métaux de transition)\n- ✅ Reconnaître les symboles moins courants\n- ✅ Compléter sa connaissance jusqu'à 36 éléments"
    icon: 🎯

resources:
  - type: summary
    title: "Qu'est-ce qu'une puissance ?"
    content: "Une **puissance** indique combien de fois un nombre est multiplié par lui-même.\n\n**Notation** : aⁿ = a × a × ... × a (n fois)\n\nExemples :\n- 3² = 3 × 3 = 9 (carré de 3)\n- 2³ = 2 × 2 × 2 = 8 (cube de 2)\n- 10⁴ = 10 × 10 × 10 × 10 = 10000\n\nLes puissances sont essentielles en :\n- Sciences (notation scientifique)\n- Informatique (puissances de 2)\n- Géométrie (aires et volumes)"
    aiGenerated: true
    icon: 📝
  - type: link
    title: "Wikipedia : Puissance"
    url: https://fr.wikipedia.org/wiki/Puissance_(mathématiques)
    icon: 📖
  - type: glossary
    title: Vocabulaire clé
    content: "- **Puissance** : Multiplication répétée d'un nombre\n- **Base** : Le nombre qui est multiplié\n- **Exposant** : Le nombre de fois qu'on multiplie\n- **Carré** : Puissance 2 (n²)\n- **Cube** : Puissance 3 (n³)\n- **Racine carrée** : Opération inverse du carré (√)"
    icon: 📚
  - type: image
    title: Carrés parfaits
    image: "data:image/svg+xml;base64,"
    aiGenerated: false
    icon: 📊
  - type: objective
    title: "Objectifs d'apprentissage"
    content: "- ✅ Reconnaître les carrés parfaits\n- ✅ Trouver leur racine carrée\n- ✅ Faire le lien carré ↔ racine"
    icon: 🎯
  - type: tip
    title: Racines carrées
    content: "La racine carrée est l'opération inverse du carré :\n√n = x signifie que x² = n\n\nExemples :\n- √9 = 3 car 3² = 9\n- √144 = 12 car 12² = 144\n- √400 = 20 car 20² = 400"
    icon: 💡

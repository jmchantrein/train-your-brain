<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests - Train Your Brain</title>
  <style>
    :root {
      --color-pass: #22c55e;
      --color-fail: #ef4444;
      --color-pending: #f59e0b;
      --color-bg: #0f172a;
      --color-bg-secondary: #1e293b;
      --color-text: #e2e8f0;
      --color-text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-text);
      background-color: var(--color-bg);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--color-bg-secondary);
    }

    .suite {
      margin-top: 24px;
      padding: 16px;
      background-color: var(--color-bg-secondary);
      border-radius: 8px;
    }

    .suite__title {
      font-size: 16px;
      font-weight: bold;
      color: #60a5fa;
      margin-bottom: 12px;
    }

    .test {
      padding: 8px 0;
      padding-left: 20px;
      border-left: 2px solid transparent;
      margin-left: 8px;
    }

    .test--pass {
      border-left-color: var(--color-pass);
    }

    .test--fail {
      border-left-color: var(--color-fail);
    }

    .test__status {
      display: inline-block;
      width: 20px;
      text-align: center;
    }

    .test__status--pass { color: var(--color-pass); }
    .test__status--fail { color: var(--color-fail); }

    .test__name {
      color: var(--color-text);
    }

    .test__error {
      margin-top: 4px;
      margin-left: 24px;
      padding: 8px;
      background-color: rgba(239, 68, 68, 0.1);
      border-radius: 4px;
      color: var(--color-fail);
      font-size: 12px;
      white-space: pre-wrap;
    }

    .summary {
      margin-top: 24px;
      padding: 16px;
      background-color: var(--color-bg-secondary);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary__stats {
      display: flex;
      gap: 24px;
    }

    .summary__stat {
      text-align: center;
    }

    .summary__value {
      font-size: 24px;
      font-weight: bold;
    }

    .summary__label {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .summary__value--pass { color: var(--color-pass); }
    .summary__value--fail { color: var(--color-fail); }
    .summary__value--total { color: #60a5fa; }

    .summary__status {
      font-size: 18px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 4px;
    }

    .summary__status--pass {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--color-pass);
    }

    .summary__status--fail {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--color-fail);
    }

    .no-tests {
      text-align: center;
      padding: 40px;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <h1>🧪 Tests - Train Your Brain</h1>

  <div id="results"></div>
  <div id="summary"></div>

  <!-- Framework de test -->
  <script src="test-utils.js"></script>

  <!-- Bibliothèques tierces -->
  <script src="../node_modules/js-yaml/dist/js-yaml.min.js"></script>
  <script src="../node_modules/katex/dist/katex.min.js"></script>

  <!-- Modules à tester (seront chargés quand ils existeront) -->
  <script src="../src/modules/i18n.js"></script>
  <script src="../src/modules/compression.js"></script>
  <script src="../src/modules/error-handler.js"></script>
  <script src="../src/modules/a11y.js"></script>
  <script src="../src/modules/state.js"></script>
  <script src="../src/modules/storage.js"></script>
  <script src="../src/modules/leitner.js"></script>
  <script src="../src/modules/xp.js"></script>
  <script src="../src/modules/validator.js"></script>
  <script src="../src/modules/router.js"></script>
  <script src="../src/modules/badges.js"></script>
  <script src="../src/modules/challenges.js"></script>
  <script src="../src/modules/tags.js"></script>
  <script src="../src/modules/themes.js"></script>
  <script src="../src/modules/audio.js"></script>
  <script src="../src/modules/latex.js"></script>
  <script src="../src/modules/yaml.js"></script>
  <script src="../src/modules/exporter.js"></script>
  <script src="../src/modules/moodle.js"></script>
  <script src="../src/modules/lingua-libre.js"></script>
  <script src="../src/modules/multilingual.js"></script>
  <script src="../src/modules/prompt-generator.js"></script>
  <script src="../src/modules/deck-validator.js"></script>

  <!-- UI Components (needed for page-game tests) -->
  <script src="../src/ui/components.js"></script>
  <script src="../src/ui/pages-base.js"></script>
  <script src="../src/ui/page-game.js"></script>
  <script src="../src/ui/effects.js"></script>
  <script src="../src/ui/tutorial.js"></script>

  <!-- Fichiers de test -->
  <script src="error-handler.test.js"></script>
  <script src="state.test.js"></script>
  <script src="storage.test.js"></script>
  <script src="leitner.test.js"></script>
  <script src="xp.test.js"></script>
  <script src="validator.test.js"></script>
  <script src="router.test.js"></script>
  <script src="badges.test.js"></script>
  <script src="challenges.test.js"></script>
  <script src="tags.test.js"></script>
  <script src="latex.test.js"></script>
  <script src="yaml.test.js"></script>
  <script src="prompt-generator.test.js"></script>
  <script src="deck-validator-duplicates.test.js"></script>
  <script src="deck-validator-readability.test.js"></script>
  <script src="page-game.test.js"></script>
  <script src="effects.test.js"></script>
  <script src="tutorial.test.js"></script>
  <script src="i18n.test.js"></script>
  <script src="exporter.test.js"></script>
  <script src="a11y.test.js"></script>
  <script src="themes.test.js"></script>
  <script src="audio.test.js"></script>
  <script src="moodle.test.js"></script>
  <script src="lingua-libre.test.js"></script>
  <script src="multilingual.test.js"></script>

  <!-- Exécution -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Vérifier si des tests sont enregistrés
      if (TestRunner.suites.length === 0) {
        document.getElementById('results').innerHTML = `
          <div class="no-tests">
            <p>📝 Aucun test enregistré.</p>
            <p style="margin-top: 10px;">
              Créez des fichiers de test dans <code>tests/*.test.js</code><br>
              et décommentez les imports dans <code>runner.html</code>
            </p>
          </div>
        `;
        return;
      }

      // Exécuter les tests
      TestRunner.run();
    });
  </script>
</body>
</html>
